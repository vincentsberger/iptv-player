# Release bei einem Versions-Tag:
#   1. appVersion in gradle.properties anheben und committen
#   2. git tag v1.3.0 && git push origin v1.3.0
#      oder am Handy auf github.com: Releases → Draft a new release → neuer Tag v1.3.0 → Publish
# Baut die signierte TV-App (APK), das Linux-Paket (.deb), den Windows-Installer (.msi) und die iPhone-App (.ipa) und
# legt das GitHub-Release an. Der Signierschlüssel kommt aus den Repository-Secrets (tools/release/set-github-secrets.sh).
#
# Der Lauf nach dem Tag-Push baut nur TV-App und PC (nach Änderungen) – iOS nie, weil der macOS-Runner oft lange
# wartet und das ganze Release aufhielte. Das iPhone kommt danach von Hand: Run workflow, Tag wählen, platforms=ios.
#
# Nur was sich seit dem vorigen Tag geändert hat, wird neu gebaut (tools/release/plan-platforms.sh): Ein reiner
# iPhone-Fix baut nur die .ipa, APK/.deb/.msi kommen unverändert aus dem vorigen Release – mit ihrer alten Version im
# Namen, darum melden TV- und PC-App kein Update. Von Hand: Actions → Release → Run workflow, den Tag als Branch/Tag
# wählen und bei „platforms“ z. B. „all“ oder „android ios“ eintragen.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'auto (nach Änderungen), all, oder Liste aus android desktop ios'
        default: auto
        type: string

permissions:
  contents: write
  actions: read # ci-done: frühere CI-Läufe desselben Commits nachsehen

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag und appVersion vergleichen
        id: check
        run: |
          version=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu appVersion=$version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Welche Plattformen werden neu gebaut? (siehe Kopf und tools/release/plan-platforms.sh)
  plan:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      previous: ${{ steps.plan.outputs.previous }}
      android: ${{ steps.plan.outputs.android }}
      desktop: ${{ steps.plan.outputs.desktop }}
      ios: ${{ steps.plan.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # alle Tags für den Vergleich mit dem vorigen Release
      - name: Geänderte Plattformen bestimmen
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CHOICE: ${{ inputs.platforms }}
        run: |
          plan=$(tools/release/plan-platforms.sh "$GITHUB_REF_NAME" "$CHOICE")
          # Tag-Push baut nie iOS: Der macOS-Runner wartet oft lange und hielte das ganze Release auf (der Job
          # „release“ braucht alle). Das iPhone kommt von Hand nach: Run workflow mit platforms=ios.
          if [ "$GITHUB_EVENT_NAME" = push ] && echo "$plan" | grep -q '^ios=true$'; then
            plan=$(echo "$plan" | sed 's/^ios=true$/ios=false/')
            echo "::notice::iPhone-Code geändert – nach diesem Lauf mit „Run workflow“ und platforms=ios nachliefern."
          fi
          echo "$plan"
          echo "$plan" >> "$GITHUB_OUTPUT"

  # Die komplette CI (Linux + Windows) für genau den getaggten Commit – gebaut wird erst, wenn sie grün ist.
  # Der Tag zeigt fast immer auf einen master-Commit, den die CI schon grün getestet hat – dann nicht noch einmal
  # alles laufen lassen (~ 11 min). Fehlt ein grüner Lauf (z. B. nur Doku geändert), läuft die CI hier.
  ci-done:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - name: Grüner CI-Lauf für diesen Commit?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" -q .total_count || echo 0)
          echo "Grüne CI-Läufe für $GITHUB_SHA: $n"
          echo "tested=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Nur für TV und PC – ein reines iPhone-Release braucht die Linux/Windows-CI nicht.
  ci:
    needs: [version, plan, ci-done]
    if: ${{ !cancelled() && needs.ci-done.outputs.tested != 'true' && (needs.plan.outputs.android == 'true' || needs.plan.outputs.desktop == 'true') }}
    uses: ./.github/workflows/ci.yml
    with:
      called: true
      android: ${{ needs.plan.outputs.android == 'true' }}
      desktop: ${{ needs.plan.outputs.desktop == 'true' }}

  android:
    needs: [version, plan, ci]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.plan.outputs.android == 'true' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.IPTV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret IPTV_KEYSTORE_BASE64 fehlt – einmalig tools/release/set-github-secrets.sh ausführen"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "IPTV_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Signierte APK bauen
        env:
          IPTV_STORE_PASSWORD: ${{ secrets.IPTV_STORE_PASSWORD }}
          IPTV_KEY_ALIAS: ${{ secrets.IPTV_KEY_ALIAS }}
          IPTV_KEY_PASSWORD: ${{ secrets.IPTV_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease

      - name: Signatur prüfen
        env:
          VERSION: ${{ needs.version.outputs.version }}
          EXPECTED_CERT: 1318a3e080cae2333a34f466b8f0943ea6913d77a4aa0f7d0d2cc5af734780d2
        run: |
          apk="IPTV-Player-$VERSION.apk"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$apk"
          # Neuestes apksigner aus dem SDK des Runners; Ausgabe sichtbar machen, falls etwas nicht stimmt.
          apksigner=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "apksigner: $apksigner"
          "$apksigner" verify --print-certs "$apk" > signers.txt 2>&1 || { cat signers.txt; echo "::error::Signatur ungültig"; exit 1; }
          # Erwarteter Upload-Schlüssel (öffentlicher Fingerabdruck, kein Geheimnis). Das Ausgabeformat
          # unterscheidet sich je nach Build-Tools-Version („Signer #1 …“ bzw. „V2 Signer: …“), daher nur der Wert.
          grep -q "certificate SHA-256 digest: $EXPECTED_CERT" signers.txt \
            || { cat signers.txt; echo "::error::APK ist nicht mit dem erwarteten Upload-Schlüssel signiert"; exit 1; }
          grep -m1 'certificate DN' signers.txt

      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: IPTV-Player-*.apk
          if-no-files-found: error

  linux:
    needs: [version, plan, ci]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.plan.outputs.desktop == 'true' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Linux-Paket bauen
        run: ./gradlew :desktopApp:packageDeb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

  # Windows-Installer (.msi). Nicht signiert → SmartScreen-Hinweis beim ersten Start.
  # Bringt die VLC-Engine mit (tools/fetch-vlc.sh, Prüfsumme fest eingetragen) – VLC muss nicht installiert sein.
  # Der Windows-Runner bringt das Android-SDK schon mit.
  windows:
    needs: [version, plan, ci]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.plan.outputs.desktop == 'true' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: VLC-Engine für den Installer holen
        shell: bash
        run: bash tools/fetch-vlc.sh
      - name: Windows-Installer und App-Ordner bauen
        run: ./gradlew.bat :desktopApp:packageMsi :desktopApp:createDistributable
      # Ohne mitgelieferte VLC-Engine zeigt die App nur „Wiedergabe-Engine fehlt“ – dann lieber kein Release.
      # packageMsi legt kein binaries/main/app an – darum den fertigen Installer selbst entpacken und prüfen.
      - name: Prüfen, dass VLC im Installer steckt
        shell: pwsh
        run: |
          $msi = Get-ChildItem desktopApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP 'msi-check'
          Start-Process msiexec.exe -Wait -ArgumentList '/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$out`""
          $dll = Get-ChildItem $out -Recurse -Filter libvlc.dll | Where-Object { $_.FullName -like '*\vlc\libvlc.dll' }
          if (-not $dll) { Write-Output "::error::VLC fehlt im Installer"; exit 1 }
          Write-Output "VLC gefunden: $($dll[0].FullName)"
      # Portable Version: derselbe App-Ordner wie im Installer (mit Java-Laufzeit und VLC), gezippt – entpacken und
      # IPTVPlayer.exe starten, ohne Installation und Adminrechte. Einstellungen liegen trotzdem unter %APPDATA%.
      - name: Portable Version packen
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $app = 'desktopApp/build/compose/binaries/main/app/IPTVPlayer'
          if (-not (Test-Path "$app/IPTVPlayer.exe")) { Write-Output "::error::IPTVPlayer.exe fehlt im App-Ordner"; exit 1 }
          if (-not (Get-ChildItem $app -Recurse -Filter libvlc.dll | Where-Object { $_.FullName -like '*\vlc\libvlc.dll' })) {
            Write-Output "::error::VLC fehlt in der portablen Version"; exit 1
          }
          # Neben die .msi legen: upload-artifact legt ab dem gemeinsamen Ordner ab, sonst landete die .msi in assets/msi/.
          $zip = "desktopApp/build/compose/binaries/main/msi/IPTVPlayer-$env:VERSION-windows-portable.zip"
          Compress-Archive -Path $app -DestinationPath $zip
          Get-Item $zip | Format-List Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/msi/IPTVPlayer-*-windows-portable.zip
          if-no-files-found: error

  # iPhone (Vorabversion): unsignierte .ipa. Scheitert dieser Job, erscheint das Release trotzdem – mit der .ipa des
  # vorigen Releases (falls vorhanden).
  ios:
    needs: [version, plan, ci]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.plan.outputs.ios == 'true' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin/Native-Compiler und -Bibliotheken cachen
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Xcode und XcodeGen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          brew install xcodegen
      - name: MobileVLCKit aus dem Cache
        id: vlckit
        uses: actions/cache@v4
        with:
          path: iosApp/vlckit
          key: vlckit-${{ hashFiles('tools/ios/fetch-vlckit.sh') }}
      - name: MobileVLCKit holen
        if: steps.vlckit.outputs.cache-hit != 'true'
        run: tools/ios/fetch-vlckit.sh
      - name: iPhone-App bauen (unsigniert)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: tools/ios/build-ipa.sh "IPTV-Player-$VERSION.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: IPTV-Player-*.ipa
          if-no-files-found: error

  release:
    needs: [version, plan, android, linux, windows, ios]
    # Jede geplante TV-/PC-Plattform muss gebaut sein; iOS darf scheitern (dann bleibt die .ipa des vorigen Releases).
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' && needs.plan.result == 'success'
      && (needs.plan.outputs.android != 'true' || needs.android.result == 'success')
      && (needs.plan.outputs.desktop != 'true' || (needs.linux.result == 'success' && needs.windows.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true # ein reines iPhone-Release mit gescheitertem Bau hat gar keine Artefakte
        with:
          path: assets
          merge-multiple: true

      # Nicht neu gebaute Plattformen: Datei aus dem bestehenden Release dieses Tags, sonst aus dem vorigen
      # (Version im Namen bleibt die alte).
      - name: Unveränderte Dateien übernehmen
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: |
          mkdir -p assets
          : > built.txt; : > kept.txt
          from() { gh release download "$1" --repo "$GITHUB_REPOSITORY" --pattern "$2" --dir assets 2> /dev/null; }
          take() { # Muster, Bezeichnung, Pflicht
            if compgen -G "assets/$1" > /dev/null; then echo "$2" >> built.txt; return; fi
            # Zuerst aus dem schon bestehenden Release dieses Tags (zweiter Lauf, z. B. nur iOS): Sonst ersetzte die
            # Datei des vorigen Tags die gerade veröffentlichte, und „IPTV-Player.apk“ zeigte wieder auf die alte
            # Version – die Apps meldeten kein Update mehr (so geschehen bei 2.1.0).
            if from "$GITHUB_REF_NAME" "$1" || { [ -n "$PREVIOUS" ] && from "$PREVIOUS" "$1"; }; then
              echo "$2 ($(basename "$(compgen -G "assets/$1" | head -1)"))" >> kept.txt
            elif [ "$3" = pflicht ]; then
              echo "::error::$2: weder neu gebaut noch im vorigen Release $PREVIOUS"; exit 1
            fi
          }
          take 'IPTV-Player-[0-9]*.apk' 'TV-App' pflicht
          take 'freeiptvplayer_*.deb' 'Linux' pflicht
          # Neu „IPTVPlayer-*.msi“, ältere Releases „FreeIPTVPlayer-*.msi“ – das Muster passt auf beide (übernommene Dateien).
          take '*IPTVPlayer-*.msi' 'Windows' pflicht
          take 'IPTVPlayer-*-windows-portable.zip' 'Windows (portabel)' optional
          take 'IPTV-Player-*.ipa' 'iPhone' optional
          ls -l assets

      # Fester Name zusätzlich: …/releases/latest/download/IPTV-Player.apk zeigt immer auf die neueste Version.
      - name: APK auch unter festem Namen
        run: cp assets/IPTV-Player-[0-9]*.apk assets/IPTV-Player.apk

      # SideStore/AltStore-Quelle: In SideStore unter „Quellen“ einmal
      # https://github.com/vincentsberger/iptv-player/releases/latest/download/sidestore-source.json eintragen –
      # danach zeigt SideStore neue iPhone-Versionen selbst an. Ohne .ipa (nie gebaut) keine Quelle.
      - name: SideStore-Quelle erzeugen
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ipa=$(compgen -G 'assets/IPTV-Player-*.ipa' | head -1 || true)
          [ -z "$ipa" ] && { echo "keine .ipa – keine Quelle"; exit 0; }
          IPA="$ipa" python3 - <<'PY'
          import json, os, re, datetime
          ipa = os.environ["IPA"]; repo = os.environ["REPO"]; tag = os.environ["TAG"]
          name = os.path.basename(ipa)
          version = re.search(r"(\d+\.\d+\.\d+)", name).group(1)
          source = {
              "name": "IPTV Player",
              "identifier": "de.vincentsberger.iptvplayer.source",
              "sourceURL": f"https://github.com/{repo}/releases/latest/download/sidestore-source.json",
              "apps": [{
                  "name": "IPTV Player",
                  "bundleIdentifier": "de.vincentsberger.iptvplayer",
                  "developerName": repo.split("/")[0],
                  "subtitle": "IPTV-Player für Xtream Codes und M3U",
                  "localizedDescription": "Live TV, Filme und Serien deines IPTV-Anbieters – mit Programm, Favoriten, Downloads und Suche. Die App enthält keine Inhalte.",
                  "iconURL": f"https://raw.githubusercontent.com/{repo}/master/iosApp/xcode/iosApp/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
                  "tintColor": "FF453A",
                  "versions": [{
                      "version": version,
                      "date": datetime.date.today().isoformat(),
                      "size": os.path.getsize(ipa),
                      "downloadURL": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                      "minOSVersion": "16.0",
                  }],
              }],
              "news": [],
          }
          json.dump(source, open("assets/sidestore-source.json", "w"), ensure_ascii=False, indent=2)
          print(f"SideStore-Quelle für {name} ({version})")
          PY

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            built=$(paste -sd, built.txt | sed 's/,/, /g')
            echo "**Neu gebaut:** ${built:-nichts}"
            if [ -s kept.txt ]; then
              echo
              echo "**Unverändert übernommen:** $(paste -sd, kept.txt | sed 's/,/, /g') – Apps ab dieser Version melden dafür kein Update."
            fi
            echo
          } > plan.md
          cat > notes.md <<'EOF'
          ## Installieren

          **Fire TV / Android TV:** In der App „Downloader“ diese Adresse eingeben:
          `https://github.com/vincentsberger/iptv-player/releases/latest/download/IPTV-Player.apk`
          Ab Version 1.4.0 aktualisiert sich die App auch selbst (Einstellungen → App).

          **Linux (Debian/Ubuntu):** VLC wird für die Wiedergabe gebraucht:
          ```
          sudo apt install vlc ./freeiptvplayer_*_amd64.deb
          ```

          **iPhone (Vorabversion):** `IPTV-Player-*.ipa` ist unsigniert und wird per Sideloading installiert –
          Anleitung: https://github.com/vincentsberger/iptv-player/blob/master/docs/IOS.md

          **Windows 10/11:** `IPTVPlayer-*.msi` ausführen – die Wiedergabe-Engine (VLC) ist enthalten,
          eine eigene VLC-Installation ist nicht nötig. Der Installer ist nicht signiert: Bei der SmartScreen-Warnung „Weitere Informationen → Trotzdem ausführen“ wählen.
          Ohne Installation: `IPTVPlayer-*-windows-portable.zip` entpacken und `IPTVPlayer\IPTVPlayer.exe` starten.
          EOF
          { cat plan.md; cat notes.md; } > notes-full.md && mv notes-full.md notes.md
          # Release schon da (z. B. am Handy über „Draft a new release“ angelegt, was den Tag erzeugt)?
          # Dann nur Dateien anhängen und die Installationshinweise vor den vorhandenen Text setzen.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body > existing.md
            { cat notes.md; echo; cat existing.md; } > combined.md
            gh release upload "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "IPTV Player $VERSION" \
              --notes-file combined.md
          else
            gh release create "$GITHUB_REF_NAME" assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "IPTV Player $VERSION" \
              --notes-file notes.md \
              --generate-notes
          fi
