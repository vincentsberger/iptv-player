# Release bei einem Versions-Tag:
#   1. appVersion in gradle.properties anheben und committen
#   2. git tag v1.3.0 && git push origin v1.3.0
#      oder am Handy auf github.com: Releases → Draft a new release → neuer Tag v1.3.0 → Publish
# Baut die signierte TV-App (APK), das Linux-Paket (.deb) und den Windows-Installer (.msi) und legt das GitHub-Release an.
# Der Signierschlüssel kommt aus den Repository-Secrets (einrichten: tools/release/set-github-secrets.sh).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read # ci-done: frühere CI-Läufe desselben Commits nachsehen

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag und appVersion vergleichen
        id: check
        run: |
          version=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu appVersion=$version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Die komplette CI (Linux + Windows) für genau den getaggten Commit – gebaut wird erst, wenn sie grün ist.
  # Der Tag zeigt fast immer auf einen master-Commit, den die CI schon grün getestet hat – dann nicht noch einmal
  # alles laufen lassen (~ 11 min). Fehlt ein grüner Lauf (z. B. nur Doku geändert), läuft die CI hier.
  ci-done:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - name: Grüner CI-Lauf für diesen Commit?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" -q .total_count || echo 0)
          echo "Grüne CI-Läufe für $GITHUB_SHA: $n"
          echo "tested=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  ci:
    needs: [version, ci-done]
    if: needs.ci-done.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml

  android:
    needs: [version, ci]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.IPTV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret IPTV_KEYSTORE_BASE64 fehlt – einmalig tools/release/set-github-secrets.sh ausführen"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "IPTV_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Signierte APK bauen
        env:
          IPTV_STORE_PASSWORD: ${{ secrets.IPTV_STORE_PASSWORD }}
          IPTV_KEY_ALIAS: ${{ secrets.IPTV_KEY_ALIAS }}
          IPTV_KEY_PASSWORD: ${{ secrets.IPTV_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease

      - name: Signatur prüfen
        env:
          VERSION: ${{ needs.version.outputs.version }}
          EXPECTED_CERT: 1318a3e080cae2333a34f466b8f0943ea6913d77a4aa0f7d0d2cc5af734780d2
        run: |
          apk="IPTV-Player-$VERSION.apk"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$apk"
          # Neuestes apksigner aus dem SDK des Runners; Ausgabe sichtbar machen, falls etwas nicht stimmt.
          apksigner=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "apksigner: $apksigner"
          "$apksigner" verify --print-certs "$apk" > signers.txt 2>&1 || { cat signers.txt; echo "::error::Signatur ungültig"; exit 1; }
          # Erwarteter Upload-Schlüssel (öffentlicher Fingerabdruck, kein Geheimnis). Das Ausgabeformat
          # unterscheidet sich je nach Build-Tools-Version („Signer #1 …“ bzw. „V2 Signer: …“), daher nur der Wert.
          grep -q "certificate SHA-256 digest: $EXPECTED_CERT" signers.txt \
            || { cat signers.txt; echo "::error::APK ist nicht mit dem erwarteten Upload-Schlüssel signiert"; exit 1; }
          grep -m1 'certificate DN' signers.txt

      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: IPTV-Player-*.apk
          if-no-files-found: error

  linux:
    needs: [version, ci]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Linux-Paket bauen
        run: ./gradlew :desktopApp:packageDeb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

  # Windows-Installer (.msi). Nicht signiert → SmartScreen-Hinweis beim ersten Start.
  # Bringt die VLC-Engine mit (tools/fetch-vlc.sh, Prüfsumme fest eingetragen) – VLC muss nicht installiert sein.
  # Der Windows-Runner bringt das Android-SDK schon mit.
  windows:
    needs: [version, ci]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: VLC-Engine für den Installer holen
        shell: bash
        run: bash tools/fetch-vlc.sh
      - name: Windows-Installer bauen
        run: ./gradlew.bat :desktopApp:packageMsi
      # Ohne mitgelieferte VLC-Engine zeigt die App nur „Wiedergabe-Engine fehlt“ – dann lieber kein Release.
      # packageMsi legt kein binaries/main/app an – darum den fertigen Installer selbst entpacken und prüfen.
      - name: Prüfen, dass VLC im Installer steckt
        shell: pwsh
        run: |
          $msi = Get-ChildItem desktopApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP 'msi-check'
          Start-Process msiexec.exe -Wait -ArgumentList '/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$out`""
          $dll = Get-ChildItem $out -Recurse -Filter libvlc.dll | Where-Object { $_.FullName -like '*\vlc\libvlc.dll' }
          if (-not $dll) { Write-Output "::error::VLC fehlt im Installer"; exit 1 }
          Write-Output "VLC gefunden: $($dll[0].FullName)"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  # iPhone (Vorabversion): unsignierte .ipa. Scheitert dieser Job, erscheint das Release trotzdem – nur ohne .ipa.
  ios:
    needs: [version, ci]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin/Native-Compiler und -Bibliotheken cachen
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Xcode und XcodeGen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          brew install xcodegen
      - name: MobileVLCKit aus dem Cache
        id: vlckit
        uses: actions/cache@v4
        with:
          path: iosApp/vlckit
          key: vlckit-${{ hashFiles('tools/ios/fetch-vlckit.sh') }}
      - name: MobileVLCKit holen
        if: steps.vlckit.outputs.cache-hit != 'true'
        run: tools/ios/fetch-vlckit.sh
      - name: iPhone-App bauen (unsigniert)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: tools/ios/build-ipa.sh "IPTV-Player-$VERSION.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: IPTV-Player-*.ipa
          if-no-files-found: error

  release:
    needs: [version, android, linux, windows, ios]
    # Nicht auf iOS warten müssen: Android, Linux und Windows reichen für ein Release.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.android.result == 'success' && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      # Fester Name zusätzlich: …/releases/latest/download/IPTV-Player.apk zeigt immer auf die neueste Version.
      - name: APK auch unter festem Namen
        run: cp assets/IPTV-Player-*.apk assets/IPTV-Player.apk

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          ## Installieren

          **Fire TV / Android TV:** In der App „Downloader“ diese Adresse eingeben:
          `https://github.com/vincentsberger/iptv-player/releases/latest/download/IPTV-Player.apk`
          Ab Version 1.4.0 aktualisiert sich die App auch selbst (Einstellungen → App).

          **Linux (Debian/Ubuntu):** VLC wird für die Wiedergabe gebraucht:
          ```
          sudo apt install vlc ./freeiptvplayer_*_amd64.deb
          ```

          **iPhone (Vorabversion):** `IPTV-Player-*.ipa` ist unsigniert und wird per Sideloading installiert –
          Anleitung: https://github.com/vincentsberger/iptv-player/blob/master/docs/IOS.md

          **Windows 10/11:** `FreeIPTVPlayer-*.msi` ausführen – die Wiedergabe-Engine (VLC) ist enthalten,
          eine eigene VLC-Installation ist nicht nötig. Der Installer ist nicht signiert: Bei der SmartScreen-Warnung „Weitere Informationen → Trotzdem ausführen“ wählen.
          EOF
          # Release schon da (z. B. am Handy über „Draft a new release“ angelegt, was den Tag erzeugt)?
          # Dann nur Dateien anhängen und die Installationshinweise vor den vorhandenen Text setzen.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body > existing.md
            { cat notes.md; echo; cat existing.md; } > combined.md
            gh release upload "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "IPTV Player $VERSION" \
              --notes-file combined.md
          else
            gh release create "$GITHUB_REF_NAME" assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "IPTV Player $VERSION" \
              --notes-file notes.md \
              --generate-notes
          fi
