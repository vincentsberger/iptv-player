# Tests bei jedem Push und Pull Request: gemeinsame Logik, Desktop-Oberfläche, Android-Build.
# Die instrumentierten TV-Tests (androidTest) brauchen einen Emulator und laufen weiterhin lokal.
# Auch Teil jedes Releases: release.yml ruft diesen Workflow auf und baut erst, wenn er grün ist.
name: CI

on:
  push:
    branches: [master]
    # Reine Doku- und iPhone-Änderungen betreffen weder PC noch TV – die iPhone-App hat ihren eigenen Workflow.
    paths-ignore: &ignore
      - 'docs/**'
      - '**/*.md'
      - 'iosApp/**'
      - 'iosUi/**'
      - 'tools/ios/**'
      - 'tools/brand/**'
      - '.tastemaker/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths-ignore: *ignore
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Desktop-UI-Tests brauchen ein Fenstersystem → virtueller Bildschirm.
      # Ein Gradle-Lauf statt zwei: Konfiguration nur einmal, Module parallel.
      - name: Tests, Android-App und TV-Tests kompilieren
        run: >-
          xvfb-run --auto-servernum ./gradlew
          :shared:desktopTest :desktopApp:test :androidApp:testDebugUnitTest
          :androidApp:assembleDebug :androidApp:compileDebugAndroidTestKotlin

      - name: Testberichte
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte
          path: '**/build/reports/tests/'

  # Windows verhält sich bei Fenstern anders (z. B. Vollbild mit Titelleiste) – Desktop-Tests dort auch ausführen.
  # Windows nur auf master und beim Release – in PRs reicht Linux (die Logik ist dieselbe JVM).
  test-windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew.bat :shared:desktopTest :desktopApp:test --console=plain

      - name: Testberichte
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte-windows
          path: '**/build/reports/tests/'
