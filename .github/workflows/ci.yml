# Tests bei jedem Push und Pull Request: gemeinsame Logik, Desktop-Oberfläche, Android-Build.
# Die instrumentierten TV-Tests (androidTest) brauchen einen Emulator und laufen weiterhin lokal.
# Auch Teil jedes Releases: release.yml ruft diesen Workflow auf und baut erst, wenn er grün ist.
name: CI

on:
  push:
    branches: [master]
    # Reine Doku- und iPhone-Änderungen betreffen weder PC noch TV – die iPhone-App hat ihren eigenen Workflow.
    paths-ignore: &ignore
      - 'docs/**'
      - '**/*.md'
      - 'iosApp/**'
      - 'iosUi/**'
      - 'tools/ios/**'
      - 'tools/brand/**'
      - '.tastemaker/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths-ignore: *ignore
  # Aus dem Release-Workflow: nur die Teile, die das Release neu baut (ohne Pfadfilter).
  workflow_call:
    inputs:
      called: { type: boolean, default: true }
      android: { type: boolean, default: true }
      desktop: { type: boolean, default: true }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Was hat sich geändert? Eine reine PC-Änderung muss die TV-App nicht bauen und umgekehrt; shared/ betrifft beide.
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.pick.outputs.android }}
      desktop: ${{ steps.pick.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.called }}
      - uses: dorny/paths-filter@v3
        id: filter
        if: ${{ !inputs.called }}
        with:
          filters: |
            common: &common
              - 'shared/**'
              - 'testing/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - '.github/workflows/ci.yml'
            desktop:
              - *common
              - 'desktopApp/**'
              - 'tools/fetch-vlc.sh'
              - 'tools/vlc-licenses/**'
            android:
              - *common
              - 'androidApp/**'
      - name: Auswahl
        id: pick
        env:
          CALLED: ${{ inputs.called }}
          IN_ANDROID: ${{ inputs.android }}
          IN_DESKTOP: ${{ inputs.desktop }}
          F_ANDROID: ${{ steps.filter.outputs.android }}
          F_DESKTOP: ${{ steps.filter.outputs.desktop }}
        run: |
          if [ "$CALLED" = true ]; then android=$IN_ANDROID; desktop=$IN_DESKTOP; else android=$F_ANDROID; desktop=$F_DESKTOP; fi
          echo "android=${android:-false}" >> "$GITHUB_OUTPUT"
          echo "desktop=${desktop:-false}" >> "$GITHUB_OUTPUT"
          echo "TV-App: ${android:-false} · PC-App: ${desktop:-false}"

  # Logik (shared) und PC-App. Desktop-UI-Tests brauchen ein Fenstersystem → virtueller Bildschirm.
  test-desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (shared und PC-App)
        run: xvfb-run --auto-servernum ./gradlew :shared:desktopTest :desktopApp:test

      - name: Testberichte
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte-desktop
          path: '**/build/reports/tests/'

  # TV-App: Unit-Tests, Debug-APK und die Geräte-Tests kompilieren. shared-Tests laufen in test-desktop
  # (ändert sich shared/, laufen beide Jobs).
  test-android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests, TV-App und TV-Tests kompilieren
        run: ./gradlew :androidApp:testDebugUnitTest :androidApp:assembleDebug :androidApp:compileDebugAndroidTestKotlin

      - name: Testberichte
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte-android
          path: '**/build/reports/tests/'

  # Windows verhält sich bei Fenstern anders (z. B. Vollbild mit Titelleiste) – Desktop-Tests dort auch ausführen.
  # Windows nur auf master und beim Release – in PRs reicht Linux (die Logik ist dieselbe JVM).
  test-windows:
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew.bat :shared:desktopTest :desktopApp:test --console=plain

      - name: Testberichte
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte-windows
          path: '**/build/reports/tests/'
