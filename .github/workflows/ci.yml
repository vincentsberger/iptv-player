# Tests bei jedem Push und Pull Request: gemeinsame Logik, Desktop-Oberfläche, Android-Build.
# Die instrumentierten TV-Tests (androidTest) brauchen einen Emulator und laufen weiterhin lokal.
# Auch Teil jedes Releases: release.yml ruft diesen Workflow auf und baut erst, wenn er grün ist.
name: CI

on:
  push:
    branches: [master]
    # Reine Doku-Änderungen betreffen keine App. iosApp braucht für alles einen Mac (VLCKit-cinterop, Xcode) und
    # hat seinen eigenen Workflow; iosUi kompiliert dagegen auch unter Linux (Job compile-ios).
    paths-ignore: &ignore
      - 'docs/**'
      - '**/*.md'
      - 'iosApp/**'
      - 'tools/ios/**'
      - 'tools/brand/**'
      - '.tastemaker/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths-ignore: *ignore
  # Aus dem Release-Workflow: nur die Teile, die das Release neu baut (ohne Pfadfilter).
  workflow_call:
    inputs:
      called: { type: boolean, default: true }
      android: { type: boolean, default: true }
      desktop: { type: boolean, default: true }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Was hat sich geändert? Eine reine PC-Änderung muss die TV-App nicht bauen und umgekehrt; shared/ betrifft beide.
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.pick.outputs.android }}
      desktop: ${{ steps.pick.outputs.desktop }}
      ios: ${{ steps.pick.outputs.ios }}
      msix: ${{ steps.pick.outputs.msix }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.called }}
      - uses: dorny/paths-filter@v3
        id: filter
        if: ${{ !inputs.called }}
        with:
          filters: |
            common: &common
              - 'shared/**'
              - 'testing/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - '.github/workflows/ci.yml'
            desktop:
              - *common
              - 'desktopApp/**'
              - 'tools/fetch-vlc.sh'
              - 'tools/vlc-licenses/**'
            android:
              - *common
              - 'androidApp/**'
            ios:
              - *common
              - 'iosUi/**'
            # MSIX für den Microsoft Store: Skript, Manifest, Assets, VLC und die Abläufe, die es aufrufen.
            msix:
              - 'desktopApp/packaging/**'
              - 'tools/fetch-vlc.sh'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'
      - name: Auswahl
        id: pick
        env:
          CALLED: ${{ inputs.called }}
          IN_ANDROID: ${{ inputs.android }}
          IN_DESKTOP: ${{ inputs.desktop }}
          F_ANDROID: ${{ steps.filter.outputs.android }}
          F_DESKTOP: ${{ steps.filter.outputs.desktop }}
          F_IOS: ${{ steps.filter.outputs.ios }}
          F_MSIX: ${{ steps.filter.outputs.msix }}
        run: |
          # Vom Release aufgerufen: iOS baut das Release ohnehin nur von Hand (eigener Lauf auf macOS).
          # Das MSIX baut im Release der Windows-Job selbst – hier nur die Prüfung in PRs und auf master.
          if [ "$CALLED" = true ]; then android=$IN_ANDROID; desktop=$IN_DESKTOP; ios=false; msix=false
          else android=$F_ANDROID; desktop=$F_DESKTOP; ios=$F_IOS; msix=$F_MSIX; fi
          echo "android=${android:-false}" >> "$GITHUB_OUTPUT"
          echo "desktop=${desktop:-false}" >> "$GITHUB_OUTPUT"
          echo "ios=${ios:-false}" >> "$GITHUB_OUTPUT"
          echo "msix=${msix:-false}" >> "$GITHUB_OUTPUT"
          echo "TV-App: ${android:-false} · PC-App: ${desktop:-false} · iPhone (kompilieren): ${ios:-false}"

  # Statische Analyse (detekt) über alle Module – läuft immer, egal welche App sich geändert hat (dauert unter einer
  # Minute). Neue Befunde lassen den Lauf scheitern; Altbefunde stehen in config/detekt/baseline.xml.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: detekt
        run: ./gradlew detekt

      - name: detekt-Bericht
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-bericht
          path: build/reports/detekt/

  # Logik (shared) und PC-App. Desktop-UI-Tests brauchen ein Fenstersystem → virtueller Bildschirm.
  test-desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (shared und PC-App)
        run: xvfb-run --auto-servernum ./gradlew :shared:desktopTest :desktopApp:test

      - name: Testberichte
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte-desktop
          path: '**/build/reports/tests/'

  # TV-App: Unit-Tests, Debug-APK und die Geräte-Tests kompilieren. shared-Tests laufen in test-desktop
  # (ändert sich shared/, laufen beide Jobs).
  test-android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests, TV-App und TV-Tests kompilieren
        run: ./gradlew :androidApp:testDebugUnitTest :androidApp:assembleDebug :androidApp:compileDebugAndroidTestKotlin

      - name: Testberichte
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte-android
          path: '**/build/reports/tests/'

  # iPhone-Code ohne Mac prüfen: Kotlin/Native kompiliert iOS-Module ohne cinterop auch unter Linux (nur iosApp mit
  # VLCKit braucht macOS). Fängt die meisten iOS-Fehler, bevor ios.yml einen macOS-Runner belegt.
  compile-ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin/Native-Compiler und -Bibliotheken cachen
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-

      - name: iPhone-Oberfläche und iOS-Tests kompilieren
        run: ./gradlew :iosUi:compileKotlinIosArm64 :shared:compileTestKotlinIosSimulatorArm64

  # Windows verhält sich bei Fenstern anders (z. B. Vollbild mit Titelleiste) – Desktop-Tests dort auch ausführen.
  # Windows nur auf master und beim Release – in PRs reicht Linux (die Logik ist dieselbe JVM).
  # MSIX packen wie im Release (Platzhalter-Identität): prüft build-msix.ps1 samt Selbstprüfung, bevor ein Release es braucht.
  package-msix:
    needs: changes
    if: needs.changes.outputs.msix == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: VLC-Engine holen
        shell: bash
        run: bash tools/fetch-vlc.sh
      - name: App-Ordner bauen
        run: ./gradlew.bat :desktopApp:createDistributable --console=plain
      - name: MSIX packen und prüfen
        shell: pwsh
        run: >-
          ./desktopApp/packaging/build-msix.ps1 -AppDir desktopApp/build/compose/binaries/main/app/IPTVPlayer
          -IdentityName CI.IPTVPlayer -Publisher "CN=CI" -PublisherDisplayName CI

  test-windows:
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew.bat :shared:desktopTest :desktopApp:test --console=plain

      - name: Testberichte
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte-windows
          path: '**/build/reports/tests/'
