# iOS: die iPhone-App bauen (und iOS-eigene Tests, wenn sich iOS-Code in shared ändert).
# macOS-Runner warten oft lange in der Schlange – deshalb so selten wie möglich:
# - nur in Pull Requests (nach dem Merge nicht noch einmal auf master) und von Hand,
# - nur bei Änderungen, die in die iPhone-App eingehen (nicht Android/PC-Teile von shared, nicht Tests, nicht Doku),
# - iOS-Kotlin-Code ohne cinterop kompiliert schon die Linux-CI (ci.yml, Job compile-ios); hier bleibt nur,
#   was einen Mac braucht: VLCKit-cinterop, Xcode, .ipa.
name: iOS

on:
  pull_request:
    paths:
      - 'shared/**'
      - '!shared/src/androidMain/**'
      - '!shared/src/desktopMain/**'
      - '!shared/src/commonTest/**'
      - '!shared/src/desktopTest/**'
      - 'iosApp/**'
      - 'iosUi/**'
      - 'tools/ios/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/ios.yml'
      - '!**/*.md'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # iOS-eigene Tests (shared/src/iosTest: Speicher, Geheimnisse, Plattform) nur, wenn sich iOS-Code in shared
      # ändert – commonTest läuft schon unter Linux als desktopTest. Von Hand gestartet: immer.
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            iosShared:
              - 'shared/src/iosMain/**'
              - 'shared/src/iosTest/**'
              - 'shared/build.gradle.kts'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin/Native-Compiler und -Bibliotheken cachen
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-

      # VLCKit (~ 400 MB entpackt) nur laden, wenn sich Version/Skript geändert hat.
      - name: MobileVLCKit aus dem Cache
        id: vlckit
        uses: actions/cache@v4
        with:
          path: iosApp/vlckit
          key: vlckit-${{ hashFiles('tools/ios/fetch-vlckit.sh') }}
      - name: MobileVLCKit holen
        if: steps.vlckit.outputs.cache-hit != 'true'
        run: tools/ios/fetch-vlckit.sh

      - name: iOS-Tests auf dem Simulator
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.iosShared == 'true'
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Xcode und XcodeGen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          brew install xcodegen

      - name: iPhone-App bauen (unsigniert, Debug – schneller; Releases bauen Release)
        env:
          IOS_CONFIGURATION: Debug
        run: tools/ios/build-ipa.sh IPTV-Player-ios.ipa

      - name: Inhalt der .ipa prüfen
        run: |
          unzip -l IPTV-Player-ios.ipa | tee ipa.txt
          grep -q 'Payload/IPTVPlayer.app/IPTVPlayer$' ipa.txt
          grep -q 'Payload/IPTVPlayer.app/Info.plist$' ipa.txt
          grep -q 'Payload/IPTVPlayer.app/Frameworks/MobileVLCKit.framework/MobileVLCKit$' ipa.txt
          grep -q 'Payload/IPTVPlayer.app/QUELLCODE-ios.txt$' ipa.txt
          ls -la IPTV-Player-ios.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: IPTV-Player-ios.ipa
          if-no-files-found: error

      - name: Testberichte
        if: always() && (github.event_name == 'workflow_dispatch' || steps.changes.outputs.iosShared == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: testberichte-ios
          path: '**/build/reports/tests/'
