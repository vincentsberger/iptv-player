org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# Build-Cache (in der CI von setup-gradle mitgesichert) und parallele Module: unveränderte Teile werden nicht neu gebaut.
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Version beider Apps – einzige Stelle zum Hochzählen (Android: versionName, Windows: packageVersion)
appVersion=2.2.0
android.experimental.lint.version=9.5.2
# iOS-Code unter Linux kompilieren (nur Klibs; Linken/Testen bleibt auf macOS)
kotlin.native.enableKlibsCrossCompilation=true
